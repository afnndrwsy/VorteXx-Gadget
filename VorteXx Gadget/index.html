<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VorteXx Gadget</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
  body {
    background-color: #0a0a0a;
    color: white;
  }
  .gadget-card {
    cursor: pointer;
    background-color: #111;
    border: 1px solid #222;
    border-radius: 10px;
    transition: 0.3s;
  }
  .gadget-card:hover {
    transform: translateY(-5px);
    border-color: #00bfff;
  }
  .navbar-brand {
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">VorteXx Gadget</a>
    <button class="btn btn-light" onclick="showAbout()">About</button>
  </div>
</nav>

<!-- GALLERY PAGE -->
<div id="gallery-section" class="container mt-4">
  <div class="row" id="gallery"></div>
</div>

<!-- ABOUT PAGE -->
<div id="about-section" class="container mt-5" style="display:none;">
  <h2>About This App</h2>
  <p><strong>VorteXx Gadget</strong> demonstrates how JavaScript and Bootstrap 
  can create a responsive and interactive web application.</p>
  <hr>
  <h5>Developer Info</h5>
  <ul>
    <li>Name: Mohamad Afnan Darwisy Bin Mohd Zuhairi</li>
    <li>Student ID: 13DIT24F1048</li>
    <li>Course: Web Design Technology</li>
  </ul>
  <button class="btn btn-outline-primary mt-3" onclick="showGallery()">Back to Gallery</button>
</div>

<!-- PRODUCT MODAL -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="productModalLabel"></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="productImage" class="img-fluid mb-3 rounded" alt="">
        <p id="productDescription"></p>
        <h5 class="text-info" id="productPrice"></h5>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const gadgets = [
  {
    name: "Xiaomi Ai Glasses",
    image: "image/xiaomi ai glasses.jpg",
    price: "RM 1179.00",
    description: "Cip Snapdragon AR1, kamera 12 MP 2K, RAM 4GB, storan 32GB, bateri 8 jam."
  },
  {
    name: "VR Meta Quest 3",
    image: "image/meta quest 3.jpg",
    price: "RM 2514.00",
    description: "Paparan 2064×2208 px, RAM 8GB, XR2 Gen 2, bateri 2–3 jam."
  },
  {
    name: "Insta360 X4",
    image: "image/insta360 x4.jpg",
    price: "RM 2499.00",
    description: "Rakam 8K, foto 72 MP, bateri 2290 mAh, kalis air 10m."
  },
  {
    name: "iPhone 17 Pro Max",
    image: "image/iphone 17 pro max.jpg",
    price: "RM 9999.00",
    description: "Skrin 6.9″ OLED 120 Hz, cip A19 Pro, RAM 12GB, storan hingga 2TB."
  }
];

const gallery = $("#gallery");

// Render gadget cards
gadgets.forEach((item, index) => {
  gallery.append(`
    <div class="col-6 col-md-3 mb-4">
      <div class="card gadget-card text-center p-2" data-index="${index}">
        <img src="${item.image}" class="img-fluid rounded mb-2">
        <h6 class="text-white">${item.name}</h6>
        <p class="text-info">${item.price}</p>
        <button class="btn btn-sm btn-primary view-details" data-index="${index}">View Details</button>
      </div>
    </div>
  `);
});

// Modal functions
$(document).on("click", ".view-details", function() {
  const index = $(this).data("index");
  const gadget = gadgets[index];
  $("#productModalLabel").text(gadget.name);
  $("#productImage").attr("src", gadget.image);
  $("#productDescription").text(gadget.description);
  $("#productPrice").text("Price: " + gadget.price);
  new bootstrap.Modal(document.getElementById("productModal")).show();
});

// Navigation functions
function showAbout() {
  $("#gallery-section").hide();
  $("#about-section").fadeIn();
}
function showGallery() {
  $("#about-section").hide();
  $("#gallery-section").fadeIn();
}
</script>

</body>
</html>
